name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    # CI exercises the application's static fallbacks and must also work for
    # pull requests where repository secrets are intentionally unavailable.
    # Production credentials belong in the deployment environment, not CI.
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: ci123456
      NEXT_PUBLIC_SANITY_DATASET: production
      NEXT_PUBLIC_SANITY_API_VERSION: '2024-01-01'
      SANITY_API_TOKEN: ''
      RESEND_API_KEY: re_ci_placeholder
      RESEND_FROM_EMAIL: noreply@example.com
      RESEND_TO_EMAIL: team@example.com
      COMPANY_POSTAL_ADDRESS: CI placeholder address
      NEWSLETTER_UNSUBSCRIBE_SECRET: ci-placeholder-secret-32-characters
      NEXT_PUBLIC_SITE_URL: https://example.com
      UPSTASH_REDIS_REST_URL: https://ci-placeholder.upstash.io
      UPSTASH_REDIS_REST_TOKEN: ci-placeholder
      SANITY_REVALIDATE_SECRET: ci-placeholder
      NEWSLETTER_ADMIN_TOKEN: ci-placeholder
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ''
      NEXT_PUBLIC_SENTRY_DSN: ''
      SENTRY_DSN: ''
      SENTRY_ORG: ''
      SENTRY_PROJECT: ''
      SENTRY_AUTH_TOKEN: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Check initial page bundle sizes
        run: node scripts/check-bundle-size.mjs
      - name: Smoke test production server
        run: |
          npm run start &
          SERVER_PID=$!
          npx wait-on http://localhost:3000 --timeout 30000
          for route in "/" "/about" "/services" "/contact" "/blog"; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:3000$route")
            if [ "$STATUS" != "200" ]; then
              echo "ERROR: Route $route returned HTTP $STATUS"
              kill $SERVER_PID
              exit 1
            fi
            echo "$route -> $STATUS"
          done
          kill $SERVER_PID
