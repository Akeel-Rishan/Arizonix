name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
      NEXT_PUBLIC_SANITY_DATASET: ${{ secrets.NEXT_PUBLIC_SANITY_DATASET }}
      NEXT_PUBLIC_SANITY_API_VERSION: '2024-01-01'
      SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}
      RESEND_TO_EMAIL: ${{ secrets.RESEND_TO_EMAIL }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      SANITY_REVALIDATE_SECRET: ${{ secrets.SANITY_REVALIDATE_SECRET }}
      NEWSLETTER_ADMIN_TOKEN: placeholder
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ''
      NEXT_PUBLIC_SENTRY_DSN: ''
      SENTRY_AUTH_TOKEN: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Check initial page bundle sizes
        run: node scripts/check-bundle-size.mjs
      - name: Smoke test production server
        run: |
          npm run start &
          SERVER_PID=$!
          npx wait-on http://localhost:3000 --timeout 30000
          for route in "/" "/about" "/services" "/contact" "/blog"; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:3000$route")
            if [ "$STATUS" != "200" ]; then
              echo "ERROR: Route $route returned HTTP $STATUS"
              kill $SERVER_PID
              exit 1
            fi
            echo "$route -> $STATUS"
          done
          kill $SERVER_PID
