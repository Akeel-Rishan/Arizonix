name: Lighthouse CI

on:
  pull_request:
    branches: [main]

jobs:
  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest
    # Lighthouse validates the fallback experience without requiring access to
    # production services or secrets (which are unavailable to forked PRs).
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: ci123456
      NEXT_PUBLIC_SANITY_DATASET: production
      NEXT_PUBLIC_SANITY_API_VERSION: '2024-01-01'
      SANITY_API_TOKEN: ''
      RESEND_API_KEY: re_ci_placeholder
      RESEND_FROM_EMAIL: noreply@example.com
      RESEND_TO_EMAIL: team@example.com
      COMPANY_POSTAL_ADDRESS: CI placeholder address
      NEWSLETTER_UNSUBSCRIBE_SECRET: ci-placeholder-secret-32-characters
      NEXT_PUBLIC_SITE_URL: https://example.com
      UPSTASH_REDIS_REST_URL: https://ci-placeholder.upstash.io
      UPSTASH_REDIS_REST_TOKEN: ci-placeholder
      SANITY_REVALIDATE_SECRET: ci-placeholder
      NEWSLETTER_ADMIN_TOKEN: ci-placeholder
      NEXT_PUBLIC_GA_MEASUREMENT_ID: ''
      NEXT_PUBLIC_SENTRY_DSN: ''
      SENTRY_DSN: ''
      SENTRY_ORG: ''
      SENTRY_PROJECT: ''
      SENTRY_AUTH_TOKEN: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Run Lighthouse CI
        run: npx lhci autorun
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.GITHUB_TOKEN }}
